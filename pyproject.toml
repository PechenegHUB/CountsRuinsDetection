[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countsruins"
version = "0.1.0"
description = "Cafe table occupancy and visible-object counting: D53 packaging and reproducibility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
countsruins = "countsruins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
